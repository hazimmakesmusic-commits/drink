<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030208">
<meta name="description" content="VOID — Enter the impossible. A solo psychedelic interactive experience.">
<title>VOID</title>
<style>:root{
  --ink:#f3efff;
  --dim:rgba(243,239,255,.55);
  --accent:#8d6bff;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#030208;color:var(--ink);overflow:hidden;overscroll-behavior:none;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:crosshair}

#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#ui>*{pointer-events:none}
#ui button,#ui input{pointer-events:auto}

/* wordmark */
#mark{position:absolute;top:calc(var(--safe-t) + 20px);left:calc(var(--safe-l) + 22px);
  font-weight:300;font-size:13px;letter-spacing:.62em;padding-left:.1em;opacity:.7;
  text-shadow:0 0 18px color-mix(in srgb,var(--accent) 70%,transparent);transition:opacity 1.2s ease}

/* name of the current world, drifts in on arrival */
#worldname{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 74px);text-align:center;
  font-size:11px;letter-spacing:.5em;text-transform:uppercase;font-weight:300;padding-left:.5em;
  opacity:0;transform:translateY(6px);transition:opacity 1.4s ease,transform 1.4s ease;
  text-shadow:0 0 22px var(--accent)}
#worldname.show{opacity:.85;transform:none}

/* world selector: three quiet orbs */
#worlds{position:absolute;left:50%;bottom:calc(var(--safe-b) + 22px);transform:translateX(-50%);
  display:flex;gap:6px;align-items:center;transition:opacity 1s ease}
#worlds button{position:relative;width:44px;height:44px;border:0;background:none;padding:0;cursor:pointer;
  display:grid;place-items:center;color:var(--ink);font:inherit}
#worlds button i{display:block;width:9px;height:9px;border-radius:50%;opacity:.5;
  transition:all .7s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset}
#worlds button[data-i="0"] i{background:radial-gradient(circle at 35% 30%,#fff 0,#a58bff 40%,#17e0ff 100%)}
#worlds button[data-i="1"] i{background:radial-gradient(circle at 35% 30%,#fff 0,#7df4ff 35%,#7c4dff 100%)}
#worlds button[data-i="2"] i{background:radial-gradient(circle at 35% 30%,#fff 0,#ffb27a 35%,#ff4a1c 70%,#c6ff3d 100%)}
#worlds button[aria-current="true"] i{width:26px;border-radius:6px;opacity:1;box-shadow:0 0 18px 1px var(--accent)}
#worlds button:hover i,#worlds button:focus-visible i{opacity:1;transform:scale(1.25)}
#worlds button[aria-current="true"]:hover i{transform:none}
#worlds button span{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10px;letter-spacing:.35em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .4s}
#worlds button:hover span,#worlds button:focus-visible span{opacity:.8}
#worlds button:focus-visible,#tools button:focus-visible,#vol:focus-visible{outline:1px solid rgba(255,255,255,.6);outline-offset:-6px;border-radius:12px}

/* sound + intensity */
#tools{position:absolute;right:calc(var(--safe-r) + 10px);bottom:calc(var(--safe-b) + 22px);
  display:flex;align-items:center;gap:0;transition:opacity 1s ease}
#tools button{width:44px;height:44px;border:0;background:none;padding:0;color:var(--ink);cursor:pointer;display:grid;place-items:center;opacity:.75}
#tools button:hover{opacity:1}
#tools svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#snd .wv,#snd .x{transition:opacity .4s}
#snd[aria-pressed="true"] .x{opacity:0}
#snd[aria-pressed="false"] .wv{opacity:0}
#calm .half{fill:currentColor;stroke:none;opacity:0;transition:opacity .4s}
#calm[aria-pressed="true"] .half{opacity:.9}
#vol{-webkit-appearance:none;appearance:none;width:0;height:44px;margin:0;background:none;opacity:0;
  transition:width .5s ease,opacity .5s ease;cursor:pointer}
#tools.snd-on #vol{width:84px;opacity:.85}
#vol::-webkit-slider-runnable-track{height:1px;background:rgba(255,255,255,.4)}
#vol::-moz-range-track{height:1px;background:rgba(255,255,255,.4)}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);margin-top:-5.5px;box-shadow:0 0 12px var(--accent)}
#vol::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ink);box-shadow:0 0 12px var(--accent)}

/* first-use hint */
#hint{position:absolute;left:0;right:0;top:50%;margin-top:calc(min(34vh,260px));text-align:center;
  font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:300;opacity:0;transition:opacity 1.6s ease;padding:0 24px}
#hint b{font-weight:300;opacity:.9}
#hint small{display:block;margin-top:12px;font-size:10px;letter-spacing:.28em;opacity:.55}
#hint.show{opacity:.8}

/* fade the chrome away so the art is alone */
#ui.idle #worlds,#ui.idle #tools{opacity:.0}
#ui.idle #mark{opacity:.32}
#ui.touching #worlds,#ui.touching #tools{opacity:0;pointer-events:none}
#ui.touching #mark{opacity:.2}
#ui:not(.idle):not(.touching) #worlds,#ui:not(.idle):not(.touching) #tools{opacity:1}
#ui.idle #worlds button,#ui.idle #tools button,#ui.idle #tools input{pointer-events:auto}

/* loading veil */
#veil{position:fixed;inset:0;z-index:20;background:#030208;display:grid;place-items:center;text-align:center;
  transition:opacity 1.6s ease .1s}
#veil.gone{opacity:0;pointer-events:none}
#veil h1{margin:0;font-weight:200;font-size:22px;letter-spacing:.9em;padding-left:.9em;animation:breathe 3.2s ease-in-out infinite}
#veil p{margin:14px 0 0;font-size:11px;letter-spacing:.4em;text-transform:uppercase;font-weight:300;opacity:.5}
@keyframes breathe{50%{opacity:.45}}

/* no-WebGL fallback: a calm CSS orb, honest message */
#nogl{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 90% at 50% 120%,#1a0b3a 0%,#030208 60%);
  display:grid;place-content:center;justify-items:center;text-align:center;padding:24px}
#nogl[hidden]{display:none}
#nogl h1{margin:28px 0 0;font-weight:200;font-size:20px;letter-spacing:.8em;padding-left:.8em}
#nogl p{opacity:.6;font-size:13px;max-width:30ch;line-height:1.6}
#nogl .orb{width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0,#b9a4ff 20%,#5b3bff 50%,#0b2a58 100%);
  filter:blur(.5px) saturate(1.3);box-shadow:0 0 80px 10px rgba(110,70,255,.35);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px) scale(1.04)}}

@media (max-width:520px){
  #mark{font-size:12px}
  #hint{font-size:11px;letter-spacing:.22em}
}
@media (prefers-reduced-motion:reduce){
  #veil h1,#nogl .orb{animation:none}
}
</style>
</head>
<body>
<canvas id="c" aria-label="VOID interactive scene" role="application"></canvas>

<div id="ui" class="idle">
  <div id="mark">VOID</div>
  <div id="worldname" aria-live="polite"></div>

  <nav id="worlds" aria-label="Worlds">
    <button type="button" data-i="0" aria-label="Liquid Dream"><i></i><span>Liquid Dream</span></button>
    <button type="button" data-i="1" aria-label="Cosmic Jelly"><i></i><span>Cosmic Jelly</span></button>
    <button type="button" data-i="2" aria-label="Melting Dimension"><i></i><span>Melting Dimension</span></button>
  </nav>

  <div id="tools">
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Volume">
    <button id="snd" type="button" aria-label="Sound" aria-pressed="false" title="Sound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5h3.2L11.5 6v12L7.2 14.5H4z"/><path class="wv" d="M15 9.2c1.2 1.6 1.2 4 0 5.6M17.6 7c2.2 2.7 2.2 7.3 0 10"/><path class="x" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>
    </button>
    <button id="calm" type="button" aria-label="Reduce intensity" aria-pressed="false" title="Reduce intensity">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path class="half" d="M12 4.5a7.5 7.5 0 0 1 0 15z"/></svg>
    </button>
  </div>

  <div id="hint"><b>touch</b> · <b>hold</b> · <b>drag</b> · <b>double-tap</b><small>two fingers swipe to change world</small></div>
</div>

<div id="veil"><div><h1>VOID</h1><p>Enter the impossible.</p></div></div>
<div id="nogl" hidden>
  <div class="orb"></div>
  <h1>VOID</h1>
  <p id="noglmsg">This device can't draw the void.</p>
</div>
